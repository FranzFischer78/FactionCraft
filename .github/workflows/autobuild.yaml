name: Build Minecraft mod (1.20.1)

on:
  push:
    branches:
      - "1.20ML"
  pull_request:
    branches:
      - "1.20ML"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Validate Minecraft target version
        run: grep -q '^minecraft_version=1\.20\.1$' gradle.properties

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: factioncraft-1.20.1-jars
          if-no-files-found: error
          path: |
            build/libs/*.jar
            common/build/libs/*.jar
            fabric/build/libs/*.jar
            forge/build/libs/*.jar
